# nginx-spa.conf
# Served inside the frontend container on port 3000.
# Handles React Router client-side routing (all paths → index.html).

server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — unknown paths go to index.html so React Router takes over
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively (Vite fingerprints filenames)
    location ~* \.(js|css|woff2?|ttf|eot|ico|png|svg|jpg|jpeg|gif|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # No caching for index.html itself
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
}