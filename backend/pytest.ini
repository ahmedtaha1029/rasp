[pytest]
DJANGO_SETTINGS_MODULE = rasp_backend.settings
python_files = tests/test_*.py
python_classes = Test*
python_functions = test_*
addopts = --tb=short -q

# Fix: Provide a full-length (50-char) secret key so Django does not emit
# InsecureKeyLengthWarning during test runs.
# This value is only used in the test environment; never commit real keys here.
env =
    SECRET_KEY=test-secret-key-for-ci-only-do-not-use-in-prod-rasp-2026
    DEBUG=True
    DB_NAME=test_rasp
    DB_USER=test_rasp
    DB_PASSWORD=test_rasp
    DB_HOST=localhost
    DB_PORT=5432
 
filterwarnings =
    error
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
 